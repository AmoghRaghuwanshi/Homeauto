name: Isolated software verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
env:
  HOMEAUTO_MQTT_ENABLED: '0'
  HOMEAUTO_DOOR_ENABLED: '0'
  HOMEAUTO_GATEWAY_ENABLED: '0'
  HOMEAUTO_CLOUD_SYNC_ENABLED: '0'
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node scripts/verify-publication.js
      - name: Check pinned Gitleaks and scan history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Immutable official v8.30.1 Linux asset; keep its checksum pinned below.
          # Prefer the release URL to avoid cached/expired API asset redirects.
          # The authenticated fallback also avoids the shared runner's anonymous API limit.
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 60 --connect-timeout 10 --max-time 60 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz" ||
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 60 --connect-timeout 10 --max-time 60 --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/octet-stream' --header 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/gitleaks/gitleaks/releases/assets/378332058?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Match server/package-lock.json; browsers and Linux libraries are preinstalled.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the mounted checkout for source verification
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix server
      - run: npm run build
      - run: node scripts/check-syntax.js
      - run: npm test
      - name: Verify preinstalled test browsers
        run: node -e "const fs=require('node:fs'); const {chromium,webkit}=require('./server/node_modules/playwright'); for(const browser of [chromium,webkit]) if(!fs.existsSync(browser.executablePath())) throw new Error('Pinned browser image does not match the package lock');"
      - run: npm --prefix server run test:ux
      - run: npm --prefix server run test:remediation
      - run: npm --prefix server run test:modules-browser
      - run: npm --prefix server run test:simulation-browser
      - run: npm --prefix server run test:browser-conversation
      - run: node server/scripts/online-browser-check.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: simulated-cloud-qa
          path: .local/qa/online
          retention-days: 3
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the mounted checkout for source verification
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts --prefix server
      - name: Verify preinstalled test browsers
        run: node -e "const fs=require('node:fs'); const {chromium,webkit}=require('./server/node_modules/playwright'); for(const browser of [chromium,webkit]) if(!fs.existsSync(browser.executablePath())) throw new Error('Pinned browser image does not match the package lock');"
      - run: npm --prefix server run test:mobile -- --browser=${{ matrix.browser }}
      - run: npm --prefix server run test:signup -- --browser=${{ matrix.browser }}
      - run: npm --prefix server run test:onboarding -- --browser=${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: simulated-mobile-${{ matrix.browser }}
          path: |
            .local/qa/mobile/${{ matrix.browser }}
            .local/qa/signup/${{ matrix.browser }}
            .local/qa/onboarding/${{ matrix.browser }}
          retention-days: 3
